# Win-Debloat "Conservative" Profile
# Best for: Work PCs, Enterprise environments, or cautious users.
# Safety: Maximum. No app removal, minimal privacy tweaks.

metadata:
  name: "Conservative"
  author: "Win-Debloat Team"
  description: "Minimal changes for maximum stability."
  version: "1.0.0"
  target_os: [ "Windows 10", "Windows 11" ]
  min_build: 19041

bloatware:
  removal_mode: "Custom"
  custom_list:
    - "Microsoft.BingWeather"
    - "Microsoft.GetHelp"
    - "Microsoft.Getstarted"
  exclude_list:
    - "Microsoft.WindowsStore"
    - "Microsoft.WindowsCalculator"

privacy:
  telemetry_level: "Basic"
  disable_copilot: false
  disable_recall: false
  disable_advertising_id: true

performance:
  power_plan: "Balanced"
  disable_background_apps: false

# System QoL (v1.4): only zero-risk annoyance fixes for work PCs
system:
  disable_suggestions: true       # ads/tips off - safe everywhere
  no_auto_reboot_updates: true    # never lose work to a surprise reboot

software:
  package_manager: "Winget"
  install_list: []
