# Win-Debloat Profile Schema v1.6.0
# Defines the structure and valid values for declarative configuration profiles

# Profile inheritance: single parent path or array of parent paths (max depth 10)
extends: [ string, list<string> ]

metadata:
  name: string
  version: string
  author: string
  description: string
  target_os: [ "Windows 10", "Windows 11", "Server 2022", "Server 2025" ]
  min_build: integer
  max_build: integer

# Conditional execution gates
when:
  min_build: integer
  max_build: integer
  target_os: [ "Windows 10", "Windows 11", "Server 2022", "Server 2025", list<string> ]
  edition: [ "Home", "Pro", "Enterprise", "Education", "Server", list<string> ]
  arch: [ "x64", "arm64" ]

bloatware:
  removal_mode: [ "None", "Conservative", "Moderate", "Aggressive", "Custom" ]
  custom_list: list<string>
  exclude_list: list<string>

privacy:
  telemetry_level: [ "Security", "Basic", "Full" ]
  disable_advertising_id: boolean
  disable_activity_history: boolean
  disable_location_tracking: boolean
  disable_copilot: boolean
  disable_recall: boolean
  disable_click_to_do: boolean
  disable_ai_fabric: boolean
  disable_copilot_feedback: boolean
  disable_edge_ai: boolean
  disable_lockscreen_widgets: boolean
  disable_account_badges: boolean
  disable_onesettings: boolean
  block_telemetry_domains: boolean

security:
  enable_wpp: boolean
  sudo_mode: [ "Disabled", "ForceNewWindow", "DisableInput", "Normal" ]
  enable_bitlocker_xts256: boolean
  enable_rpc_hardening: boolean
  enable_smb_signing: boolean
  enable_lsa_protection: boolean
  enable_audit_logging: boolean
  enable_dma_protection: boolean

performance:
  power_plan: [ "Balanced", "HighPerformance", "Ultimate" ]
  visual_effects: [ "Appearance", "Performance", "Custom" ]
  disable_game_bar: boolean
  disable_background_apps: boolean
  gaming_mode: boolean
  enable_directstorage_tuning: boolean
  enable_thread_director: boolean
  enable_amd_x3d_safeguards: boolean
  enable_hags_tdr_tuning: boolean
  enable_directsr: boolean
  disable_energy_saver_ac_throttling: boolean

network:
  dns_servers: list<string>
  disable_ipv6: boolean
  tcp_congestion_provider: [ "cubic", "bbr2", "newreno", "default" ]
  disable_netadapter_rsc: boolean

# System & QoL tweaks (v1.4 - v1.6). All keys are opt-in booleans; omit to skip.
system:
  disable_fast_startup: boolean
  prevent_auto_bitlocker: boolean
  disable_delivery_optimization: boolean
  disable_storage_sense: boolean
  no_auto_reboot_updates: boolean
  no_early_updates: boolean
  disable_sticky_keys_shortcut: boolean
  disable_share_drag_tray: boolean
  disable_find_my_device: boolean
  disable_modern_standby_networking: boolean
  disable_widgets: boolean
  hide_chat_taskbar: boolean
  disable_transparency: boolean
  disable_snap_assist: boolean
  hide_start_all_apps: boolean
  disable_suggestions: boolean
  hide_settings_home: boolean
  hide_phone_link_start: boolean
  debloat_search: boolean

software:
  package_manager: [ "Winget", "Chocolatey", "Auto" ]
  install_list: list<string>
  uninstall_list: list<string>

custom_registry:
  list<object>:
    path: string
    name: string
    value: [ integer, string, list<string>, binary ]
    type: [ "DWord", "QWord", "String", "ExpandString", "MultiString", "Binary", "None" ]
    action: [ "Set", "Remove", "RemoveKey", "EnsureNotExist" ]
    when: object

custom_services:
  list<object>:
    name: string
    startup_type: [ "Automatic", "AutomaticDelayedStart", "Manual", "Disabled", "NoChange" ]
    state: [ "Running", "Stopped", "Ignore" ]
    action: [ "Configure", "Stop", "Start", "Disable" ]
    when: object
