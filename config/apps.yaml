        name: "Mozilla Firefox"
        winget: "Mozilla.Firefox"
        choco: "firefox"
        recommended: true
        description: "Open-source, privacy-first independent web browser"
      - id: "Brave.Brave"
        name: "Brave Browser"
        winget: "Brave.Brave"
        choco: "brave"
        recommended: true
        description: "Privacy browser with native ad & tracker blocking"
