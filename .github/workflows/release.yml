name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Single-File Executables
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Dual Release with SPDX 2.3 SBOM
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          & ./build/Build-DualRelease.ps1 -Version $version -OutputDir dist -Platform all

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Win-Debloat.exe
            dist/Win-Debloat-arm64.exe
            dist/Win-Debloat-Extras.exe
            dist/Win-Debloat-Extras-arm64.exe
            dist/win-debloat-sbom.spdx.json
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
