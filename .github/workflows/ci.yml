name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Run AST 5-Way Parity Verification
      shell: pwsh
      run: |
        & ./tests/AST/Test-WinDebloatAstExportParity.ps1

    - name: Run Complete Test Suite (PowerShell 7.6+)
      shell: pwsh
      run: |
        if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]"5.5" })) {
            Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
        }
        & ./tests/Run-AllTests.ps1 -Suite All -Output Detailed -CI -CodeCoverage

    - name: Verify PowerShell 5.1 Auto-Forwarding & Bootstrap
      shell: powershell
      run: |
        Write-Host "Verifying Windows PowerShell 5.1 runner bootstrap..." -ForegroundColor Cyan
        & ./tests/Run-AllTests.ps1 -Suite AST -CI

    - name: Verify Dual Release Build Process
      if: matrix.os == 'windows-2025'
      shell: pwsh
      run: |
        & ./build/Build-DualRelease.ps1 -Version "0.0.0-CI" -OutputDir dist -Platform all
        
        $requiredFiles = @(
            "dist/Win-Debloat.exe",
            "dist/Win-Debloat-arm64.exe",
            "dist/Win-Debloat-Extras.exe",
            "dist/Win-Debloat-Extras-arm64.exe",
            "dist/Win-Debloat-v0.0.0-CI.zip",
            "dist/Win-Debloat-Extras-v0.0.0-CI.zip",
            "dist/win-debloat-sbom.spdx.json",
            "dist/SHA256SUMS.txt",
            "dist/RELEASE_NOTES.md"
        )
        foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file)) {
                Write-Error "Build verification failed: Required release asset missing: $file"
            }
        }
        Write-Host "✅ All dual release artifacts verified successfully." -ForegroundColor Green

    - name: Upload Test & Coverage Artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-artifacts-${{ matrix.os }}
        path: |
          tests/TestResults.xml
          tests/Coverage.xml
        retention-days: 14
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore

  lint:
    name: Lint & Static Code Analysis
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install PSScriptAnalyzer
      shell: pwsh
      run: |
        Set-PSRepository PSGallery -InstallationPolicy Trusted
        Install-Module PSScriptAnalyzer -ErrorAction Stop

    - name: Invoke-ScriptAnalyzer
      shell: pwsh
      run: |
        # Scope to first-party code (vendored powershell-yaml is excluded)
        $settingsPath = "./PSScriptAnalyzerSettings.psd1"
        $results = @(Invoke-ScriptAnalyzer -Path src -Settings $settingsPath -Recurse -Severity Error |
            Where-Object { $_.ScriptPath -notlike '*\Vendor\*' })
        $results += @(Invoke-ScriptAnalyzer -Path Win-Debloat.ps1 -Settings $settingsPath -Severity Error)
        $results += @(Invoke-ScriptAnalyzer -Path Win-Debloat7.ps1 -Settings $settingsPath -Severity Error)
        
        if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            exit 1
        }
        Write-Host "✅ Zero PSScriptAnalyzer errors detected." -ForegroundColor Green
